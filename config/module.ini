[info]
name         = "Vocab Sync"
version      = "1.38.3"
description  = "Controlled vocabularies where each term has a stable id: rename a term once and every item that uses it shows the new name at once. Import an existing Custom Vocab (Terms mode), retire terms, add terms from the edit form, and undo anything from the activity log."
tags         = "controlled vocabulary, terms, custom vocab, authority, metadata"
license      = "GPL-3.0-or-later"
author       = "Phumraphee Sae-tang"
author_link  = "https://github.com/phumraphee"
module_link  = "https://github.com/phumraphee/VocabSync"
support_link = "https://github.com/phumraphee/VocabSync/issues"
configurable = false
omeka_version_constraint = "^4.0.0"
